<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/salon-inventory/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>salon-inventory</title>
    <script type="module" crossorigin src="/salon-inventory/assets/index-cq9wSqMM.js"></script>
    <link rel="stylesheet" crossorigin href="/salon-inventory/assets/index-DWj3ZPsb.css">
  </head>
  <body>
    <script>
      // バージョンチェック: 新しいデプロイを自動検知してリロード
      (function() {
        var base = '/salon-inventory/';
        var key = 'salon-app-version';
        // URL に _v= があればキャッシュバスト済みなので除去してクリーンなURLに戻す
        if (location.search.indexOf('_v=') !== -1) {
          var clean = location.href.replace(/[?&]_v=[^&]*/, '').replace(/\?$/, '');
          history.replaceState(null, '', clean);
        }
        fetch(base + 'version.txt?t=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.text() : null; })
          .then(function(v) {
            if (!v) return;
            v = v.trim();
            var local = localStorage.getItem(key);
            if (local && local !== v) {
              localStorage.setItem(key, v);
              var u = location.href.split('?')[0].split('#')[0];
              location.replace(u + '?_v=' + v + (location.hash || ''));
            } else {
              localStorage.setItem(key, v);
            }
          })
          .catch(function() {});
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
